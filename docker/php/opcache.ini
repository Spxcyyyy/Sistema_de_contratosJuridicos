; Reduce how often opcache re-checks file timestamps on disk.
; This matters here because the app source is on a Windows bind mount,
; which is slow for filesystem stat() calls under Docker Desktop.
; This Docker environment runs Yii in production mode (web/index.php).
; Avoid timestamp checks across the Windows bind mount on web requests.
; After changing PHP files or Composer dependencies: docker compose restart php
; For live development, set validate_timestamps=1 and revalidate_freq=0,
; then restart php once to load these settings.
opcache.validate_timestamps=0
opcache.revalidate_freq=0

; Server timezone: Zacatecas / Ciudad de México (UTC-6, sin horario de verano).
date.timezone=America/Mexico_City
